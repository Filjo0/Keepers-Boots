name: Project checks

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-suite:
    # A$0: standard hosted runners are free for public repositories only.
    # Keep this skipped for any private backup; no billable resources or storage.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Create project environment
        run: python -m venv .venv
      - name: Install pinned dependencies
        run: .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check dependencies
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Run complete local suite
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Check documentation
        run: .\.venv\Scripts\python.exe tools/check_docs.py
      - name: Verify dependency notices
        run: .\.venv\Scripts\python.exe tools/export_dependency_notices.py --check
      - name: Exercise deterministic CLI
        run: .\.venv\Scripts\python.exe -m keepers_boots
      - name: Check patch whitespace
        run: git diff-tree --check HEAD
